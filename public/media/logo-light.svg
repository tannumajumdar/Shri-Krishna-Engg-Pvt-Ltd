<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 356" fill="none">
  <!-- SKE monogram: slatted royal-blue S and E interlock with a bold lime K.
       White-knockout variant for dark backgrounds. -->
  <g>
    <!-- ============================== S ============================== -->
    <g fill="#FFFFFF">
      <rect x="30" y="24" width="252" height="27" rx="3"/>
      <rect x="30" y="57" width="252" height="27" rx="3"/>
      <rect x="30" y="51" width="54" height="90" rx="3"/>
      <rect x="30" y="119" width="252" height="27" rx="3"/>
      <rect x="30" y="152" width="252" height="27" rx="3"/>
      <rect x="228" y="146" width="54" height="90" rx="3"/>
      <rect x="30" y="214" width="252" height="27" rx="3"/>
      <rect x="30" y="247" width="252" height="27" rx="3"/>
    </g>

    <!-- ============================== K ============================== -->
    <!-- bold lime K, arms reaching into the S and E counters -->
    <g fill="#5CB531">
      <polygon points="356,24 428,24 428,120 526,24 624,24 476,149 628,274 528,274 428,178 428,274 356,274"/>
    </g>

    <!-- ============================== E (reversed, right spine) ====== -->
    <g fill="#FFFFFF">
      <rect x="896" y="24" width="54" height="250" rx="3"/>
      <rect x="700" y="24" width="250" height="27" rx="3"/>
      <rect x="700" y="57" width="250" height="27" rx="3"/>
      <rect x="700" y="119" width="222" height="27" rx="3"/>
      <rect x="700" y="152" width="222" height="27" rx="3"/>
      <rect x="700" y="214" width="250" height="27" rx="3"/>
      <rect x="700" y="247" width="250" height="27" rx="3"/>
    </g>
  </g>

  <!-- ============================ wordmark ============================ -->
  <text x="490" y="342" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-weight="700"
        font-size="78" letter-spacing="0.5" fill="#FFFFFF">Shri Krishna Engineering</text>
</svg>
