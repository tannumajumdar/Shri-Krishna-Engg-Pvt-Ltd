[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Exclude heavy static assets and unused Prisma 7 WASM database compilers (cockroachdb, postgresql, sqlite, sqlserver).
# This application only uses MySQL/MariaDB. Excluding the unused 51MB+ of other database compilers shrinks the Netlify function zip from >90MB down to <5MB.
[functions]
  node_bundler = "esbuild"
  included_files = [
    "!public/media/**",
    "!public/uploads/**",
    "!node_modules/@prisma/client/runtime/*.cockroachdb.*",
    "!node_modules/@prisma/client/runtime/*.postgresql.*",
    "!node_modules/@prisma/client/runtime/*.sqlite.*",
    "!node_modules/@prisma/client/runtime/*.sqlserver.*",
    "!node_modules/@prisma/client/runtime/*.map",
    "!node_modules/@prisma/engines/**",
    "!node_modules/prisma/**"
  ]

[functions."___netlify-server-handler"]
  node_bundler = "esbuild"
  included_files = [
    "!public/media/**",
    "!public/uploads/**",
    "!node_modules/@prisma/client/runtime/*.cockroachdb.*",
    "!node_modules/@prisma/client/runtime/*.postgresql.*",
    "!node_modules/@prisma/client/runtime/*.sqlite.*",
    "!node_modules/@prisma/client/runtime/*.sqlserver.*",
    "!node_modules/@prisma/client/runtime/*.map",
    "!node_modules/@prisma/engines/**",
    "!node_modules/prisma/**"
  ]

# Cache headers for media files served by Netlify CDN
[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
